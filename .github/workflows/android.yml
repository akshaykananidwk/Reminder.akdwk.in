name: Android build

# Builds the Krishna Reminder APK and publishes a signed release.
#
#   push to main / manual run -> debug + release APK as artifacts
#   tag v* or manual "release" -> GitHub Release with the signed APK attached
#
# Required repository secrets for a signed build (all optional — without them
# the workflow still produces a debug-signed APK so forks keep working):
#   KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
# Optional: GOOGLE_SERVICES_JSON (Firebase push), KR_BASE_URL (self-hosted server)

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'android/**'
  workflow_dispatch:
    inputs:
      make_release:
        description: 'Create a GitHub Release with the APK'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Generate Gradle wrapper if missing
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.7 --no-daemon
          fi

      - name: Write google-services.json
        if: ${{ secrets.GOOGLE_SERVICES_JSON != '' }}
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          echo "$GOOGLE_SERVICES_JSON" > app/google-services.json
          echo "Firebase config written."

      - name: Decode signing keystore
        id: keystore
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          echo "path=$RUNNER_TEMP/release.keystore" >> "$GITHUB_OUTPUT"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Read version name
        id: version
        run: |
          VERSION=$(grep -E '^\s*val versionMajor' app/build.gradle.kts | grep -oE '[0-9]+')
          MINOR=$(grep -E '^\s*val versionMinor' app/build.gradle.kts | grep -oE '[0-9]+')
          PATCH=$(grep -E '^\s*val versionPatch' app/build.gradle.kts | grep -oE '[0-9]+')
          echo "name=${VERSION}.${MINOR}.${PATCH}" >> "$GITHUB_OUTPUT"
          echo "Version: ${VERSION}.${MINOR}.${PATCH} (build ${GITHUB_RUN_NUMBER})"

      - name: Build debug APK
        env:
          KR_BASE_URL: ${{ secrets.KR_BASE_URL }}
        run: ./gradlew --no-daemon assembleDebug

      - name: Build release APK
        env:
          KEYSTORE_FILE: ${{ steps.keystore.outputs.path }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KR_BASE_URL: ${{ secrets.KR_BASE_URL }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Rename artifacts
        run: |
          mkdir -p ../dist
          cp app/build/outputs/apk/release/app-release.apk \
             "../dist/krishna-reminder-${{ steps.version.outputs.name }}-${GITHUB_RUN_NUMBER}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk \
             "../dist/krishna-reminder-${{ steps.version.outputs.name }}-${GITHUB_RUN_NUMBER}-debug.apk"
          ls -lh ../dist

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: krishna-reminder-apk-${{ steps.version.outputs.name }}-${{ github.run_number }}
          path: dist/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Collect release notes
        if: startsWith(github.ref, 'refs/tags/v') || inputs.make_release
        id: notes
        working-directory: .
        run: |
          PREVIOUS=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")

          {
            echo 'body<<KRISHNA_EOF'
            echo "### Krishna Reminder ${{ steps.version.outputs.name }} (build ${GITHUB_RUN_NUMBER})"
            echo ""

            if [ -n "$PREVIOUS" ]; then
              echo "**Changes since $PREVIOUS**"
              git log --pretty=format:'- %s (%an)' "$PREVIOUS"..HEAD -- android/ | head -40
            else
              echo "**Recent changes**"
              git log --pretty=format:'- %s (%an)' -20 -- android/
            fi

            echo ""
            echo ""
            echo "Install: download the APK below, open it and allow installation from your browser."
            echo "The app needs exact alarms, full-screen notifications and battery-optimisation exemption to ring reliably."
            echo ""
            echo "🙏 જય શ્રી કૃષ્ણ — AK Computer, Dwarka"
            echo 'KRISHNA_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.make_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}-{1}', steps.version.outputs.name, github.run_number) }}
          name: Krishna Reminder ${{ steps.version.outputs.name }}
          body: ${{ steps.notes.outputs.body }}
          files: dist/*.apk
          draft: false
          prerelease: false
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        run: |
          {
            echo "## Krishna Reminder — Android build"
            echo ""
            echo "| Item | Value |"
            echo "|---|---|"
            echo "| Version | ${{ steps.version.outputs.name }} |"
            echo "| Build | ${GITHUB_RUN_NUMBER} |"
            echo "| Signed | ${{ steps.keystore.outputs.signed == 'true' && 'release keystore' || 'debug key (no KEYSTORE_BASE64 secret)' }} |"
            echo "| Firebase | ${{ secrets.GOOGLE_SERVICES_JSON != '' && 'configured' || 'not configured (push disabled)' }} |"
          } >> "$GITHUB_STEP_SUMMARY"
